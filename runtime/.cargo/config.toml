[build]
target = "riscv64im-succinct-zkvm-elf"

[target.riscv64im-succinct-zkvm-elf]
# Same flags `cargo prove build` uses, plus `-relax` (our linker does not relax).
rustflags = [
  "-C", "passes=lower-atomic",
  "-C", "panic=abort",
  "--cfg", "getrandom_backend=\"custom\"",
  "-C", "target-feature=-relax",
]
