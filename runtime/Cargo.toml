[package]
name = "move-rt"
version = "0.1.0"
edition = "2024"
description = "Runtime linked into every move2sp1 program: SP1 entrypoint + Move natives"
license = "Apache-2.0"

[lib]
crate-type = ["staticlib"]

[dependencies]
sp1-zkvm = "6.10.0"
sha2 = { version = "0.10", default-features = false }
sha3 = { version = "0.10", default-features = false }

[profile.release]
panic = "abort"
lto = "fat"
codegen-units = 1
opt-level = 3
