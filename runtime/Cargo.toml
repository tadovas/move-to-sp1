[workspace]
resolver = "2"
members = ["core", "sui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
move-rt-core = { path = "core" }
# `bump`: pointer-increment allocator. Move memory is never freed, so a general-purpose
# allocator (the default, TLSF) only adds cycles.
sp1-zkvm = { version = "6.10.0", features = ["bump"] }
sha2 = { version = "0.10.8", default-features = false }
tiny-keccak = { version = "2.0.2", features = ["sha3", "keccak"] }

[profile.release]
panic = "abort"
lto = "fat"
codegen-units = 1
opt-level = 3

# SP1 precompile-accelerated hashing: Succinct's patched crates route SHA-256 compression and
# the Keccak permutation to zkVM syscalls (also speeds up sp1-zkvm's own public-values hash).
[patch.crates-io]
sha2 = { git = "https://github.com/sp1-patches/RustCrypto-hashes", package = "sha2", tag = "patch-sha2-0.10.8-sp1-6.10.0" }
tiny-keccak = { git = "https://github.com/sp1-patches/tiny-keccak", tag = "patch-2.0.2-sp1-6.10.0" }
k256 = { git = "https://github.com/sp1-patches/elliptic-curves", tag = "patch-k256-13.4-sp1-6.10.0" }
p256 = { git = "https://github.com/sp1-patches/elliptic-curves", tag = "patch-p256-13.2-sp1-6.10.0" }
bls12_381 = { git = "https://github.com/sp1-patches/bls12_381", tag = "patch-0.8.0-sp1-6.10.0-v2" }
curve25519-dalek = { git = "https://github.com/sp1-patches/curve25519-dalek", tag = "patch-4.1.3-sp1-6.2.0" }
