[package]
name = "move-rt-sui"
description = "move2sp1 runtime for Sui Move: the core runtime plus Sui framework natives"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "move_rt_sui"
crate-type = ["staticlib"]

[dependencies]
move-rt-core.workspace = true
sp1-zkvm.workspace = true
sha2.workspace = true
tiny-keccak.workspace = true
blake2 = { version = "0.10", default-features = false }
k256 = { version = "0.13.4", default-features = false, features = ["ecdsa", "alloc"] }
p256 = { version = "0.13.2", default-features = false, features = ["ecdsa", "alloc"] }
ed25519-dalek = { version = "2.1", default-features = false }
