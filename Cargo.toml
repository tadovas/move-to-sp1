[workspace]
resolver = "3"
members = ["compiler", "runner"]
# `runtime/` is a separate workspace: it targets the SP1 zkVM with Succinct's toolchain and is
# built by `compiler/build.rs`.
exclude = ["runtime"]

# The SP1 executor is unusably slow unoptimized; optimize dependencies even in dev builds.
[profile.dev.package."*"]
opt-level = 3
