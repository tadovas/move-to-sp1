[package]
name = "move2sp1"
version = "0.1.0"
edition = "2024"
description = "Ahead-of-time compiler: Move source -> LLVM IR -> RISC-V ELF runnable in the SP1 zkVM"
license = "Apache-2.0"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
inkwell = { version = "0.11", features = ["llvm20-1"] }
serde_json = "1"
object = { version = "0.37", default-features = false, features = ["read", "write", "elf", "std"] }

move-compiler = { git = "https://github.com/MystenLabs/sui", rev = "1c2b97ab17ccd5fb43c445e44351bc269ddaf76f" }
move-binary-format = { git = "https://github.com/MystenLabs/sui", rev = "1c2b97ab17ccd5fb43c445e44351bc269ddaf76f" }
move-core-types = { git = "https://github.com/MystenLabs/sui", rev = "1c2b97ab17ccd5fb43c445e44351bc269ddaf76f" }
move-symbol-pool = { git = "https://github.com/MystenLabs/sui", rev = "1c2b97ab17ccd5fb43c445e44351bc269ddaf76f" }
move-command-line-common = { git = "https://github.com/MystenLabs/sui", rev = "1c2b97ab17ccd5fb43c445e44351bc269ddaf76f" }
